<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ musica['titulo'] }} - Louvemos Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-principal: #f4f6f9;
            --bg-card: rgba(255, 255, 255, 0.9);
            --texto-principal: #0f172a;
            --texto-secundario: #475569;
            --texto-suave: #94a3b8;
            --azul-marca: #2563eb;
            --azul-toque: #3b82f6;
            --borda: rgba(226, 232, 240, 0.6);
            --cifra-cor: #2563eb;
            --fonte-premium: 'Inter', system-ui, sans-serif;
        }
        [data-theme="dark"] {
            --bg-principal: #0b0f19;
            --bg-card: rgba(30, 41, 59, 0.92);
            --texto-principal: #f8fafc;
            --texto-secundario: #cbd5e1;
            --texto-suave: #64748b;
            --azul-marca: #3b82f6;
            --azul-toque: #60a5fa;
            --borda: rgba(51, 65, 85, 0.6);
            --cifra-cor: #60a5fa;
        }

        body { font-family: var(--fonte-premium); -webkit-font-smoothing: antialiased; margin: 0; padding: 40px 20px; transition: 0.3s; color: var(--texto-principal); }
        
        body:not([data-theme="dark"]) { background-image: url("{{ url_for('static', filename='fundo.png') }}?v={{ versao_fundo }}"); background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat; }
        [data-theme="dark"] body { background-image: url("{{ url_for('static', filename='fundo_escuro.png') }}?v={{ versao_fundo }}"); background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat; }

        .wrapper { max-width: 800px; margin: 0 auto; }
        .voltar { text-decoration: none; color: var(--azul-marca); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 25px; transition: color 0.2s; }
        .voltar:hover { color: var(--azul-toque); }
        
        .header-musica { background: var(--bg-card); backdrop-filter: blur(12px); padding: 30px; border-radius: 16px; border: 1px solid var(--borda); box-shadow: 0 4px 20px -2px rgba(0,0,0,0.03); }
        h1 { color: var(--texto-principal); margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
        h3 { color: var(--texto-secundario); margin: 6px 0 0 0; font-weight: 500; font-size: 16px; }
        
        .barra-acoes { display: flex; align-items: center; gap: 12px; margin: 25px 0; position: relative; }
        .abas-visao { display: flex; background: var(--bg-card); backdrop-filter: blur(12px); padding: 4px; border-radius: 10px; border: 1px solid var(--borda); }
        .btn-aba { font-family: var(--fonte-premium); font-size: 14px; padding: 8px 16px; cursor: pointer; border-radius: 7px; border: none; background: transparent; color: var(--texto-secundario); font-weight: 600; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
        .btn-aba.ativo { background-color: var(--azul-marca); color: white; }
        
        .btn-gatilho-tom { font-family: var(--fonte-premium); font-size: 14px; padding: 12px 18px; cursor: pointer; border-radius: 10px; border: 1px solid var(--borda); background-color: var(--bg-card); color: var(--texto-principal); font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .badge-tom-atual { color: var(--azul-marca); font-weight: 800; }

        .quadrado-tons { display: none; position: absolute; top: 50px; left: 215px; background: var(--bg-card); padding: 15px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 1px solid var(--borda); z-index: 100; width: 220px; }
        .quadrado-tons.aberto { display: block; }
        .grade-tons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .btn-nota { font-family: var(--fonte-premium); text-align: center; font-size: 13px; padding: 8px 0; cursor: pointer; border-radius: 6px; border: 1px solid var(--borda); background-color: var(--bg-principal); color: var(--texto-principal); font-weight: 600; }
        .btn-nota.ativo { background-color: var(--azul-marca); color: white; }

        .letra-cifrada { font-family: 'Roboto Mono', monospace; font-size: 17px; font-weight: 500; color: #111827; line-height: 1.6; white-space: pre-wrap; background: var(--bg-card); padding: 35px; border-radius: 16px; border: 1px solid var(--borda); box-shadow: 0 4px 20px -2px rgba(0,0,0,0.03); }
        [data-theme="dark"] .letra-cifrada { color: #f8fafc; }
        
        .cifra { color: var(--cifra-cor); font-weight: 700; }
        .bloco-marca { color: #f97316; font-weight: 800; display: block; margin: 15px 0 5px 0; text-transform: uppercase; font-size: 15px; }
        
        .modo-vocal .cifra { display: none; }
        .modo-vocal .letra-cifrada { line-height: 1.8; font-family: var(--fonte-premium); font-size: 20px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="wrapper">
        <a class="voltar" href="/"><i class="fa-solid fa-arrow-left"></i> Voltar para a lista</a>
        <div class="header-musica">
            <h1>{{ musica['titulo'] }}</h1>
            <h3><i class="fa-regular fa-user" style="font-size: 14px; margin-right: 4px;"></i> {{ musica['artista'] }}</h3>
        </div>
        <div class="barra-acoes">
            <div class="abas-visao">
                <button id="aba-cifra" class="btn-aba ativo" onclick="mudarModoVisao('cifra')"><i class="fa-solid fa-guitar"></i> Cifra</button>
                <button id="aba-letra" class="btn-aba" onclick="mudarModoVisao('letra')"><i class="fa-solid fa-microphone"></i> Letra</button>
            </div>
            <button id="btn-janela-tom" class="btn-gatilho-tom" onclick="alternarQuadradoTom(event)">
                <i class="fa-solid fa-sliders"></i> Tom: <span id="label-tom-atual" class="badge-tom-atual">{{ musica['tom_original'] }}</span>
            </button>
            <div id="janela-quadrado-tom" class="quadrado-tons"><div class="grade-tons" id="grade-botoes-tom"></div></div>
        </div>
        <div id="container-cifra" class="letra-cifrada"></div>
    </div>

    <script>
        document.documentElement.setAttribute('data-theme', localStorage.getItem('tema') || 'light');
        const letraOriginal = `{{ musica['letra'] }}`;
        const tomOriginal = `{{ musica['tom_original'] }}`;
        const notas = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        let semitonsAjustados = 0;
        
        const tomOriginalBase = tomOriginal.match(/^[CDEFGAB][#b]?/)[0];
        const ehTomMenor = tomOriginal.includes('m') && !tomOriginal.includes('maj');

        function alternarQuadradoTom(event) { event.stopPropagation(); document.getElementById('janela-quadrado-tom').classList.toggle('aberto'); }
        
        function gerarGradeDeTons() {
            const containerBotoes = document.getElementById('grade-botoes-tom'); containerBotoes.innerHTML = '';
            notas.forEach(nota => {
                const botao = document.createElement('button'); botao.className = 'btn-nota'; botao.innerText = nota + (ehTomMenor ? 'm' : '');
                const raizTransposta = transporNotaRaiz(tomOriginalBase, semitonsAjustados);
                if (botao.innerText === (raizTransposta + (ehTomMenor ? 'm' : ''))) botao.classList.add('ativo');
                botao.onclick = function() { definirTomDireto(nota); };
                containerBotoes.appendChild(botao);
            });
        }

        function definirTomDireto(notaEscolhida) {
            semitonsAjustados = notas.indexOf(notaEscolhida) - notas.indexOf(tomOriginalBase);
            document.getElementById('label-tom-atual').innerText = transporAcordeCompleto(tomOriginal, semitonsAjustados);
            renderizarCifra(); gerarGradeDeTons();
        }

        function transporNotaRaiz(notaRaiz, quantidade) {
            let indice = notas.indexOf(notaRaiz);
            if (indice === -1) return notaRaiz;
            let novoIndice = (indice + quantidade) % 12; if (novoIndice < 0) novoIndice += 12;
            return notas[novoIndice];
        }

        function transporAcordeCompleto(acorde, quantidade) {
            if (quantidade === 0) return acorde;
            const partes = acorde.split('/');
            return partes.map(parte => {
                const match = parte.match(/^([CDEFGAB][#b]?)(.*)$/);
                return match ? transporNotaRaiz(match[1], quantidade) + match[2] : parte;
            }).join('/');
        }

        function renderizarCifra() {
            const linhas = letraOriginal.split('\n');
            let novoHtml = '';
            
            // REGEX TURBINADA: Aceita variações como M, m, maj, dim, sus, aug, add, 7, 9, 11, 13, +, -, º, / e parênteses.
            const regexAcorde = /^[A-G][#b]?(m|M|maj|dim|sus|aug|º|add)?\d*(m|M)?\d*(\+|-|º)?(\([^)]+\))?(\/\d+)?(\/[A-G][#b]?)?$/;
            
            const regexBloco = /^\[.*\]$/;

            linhas.forEach(linha => {
                const linhaLimpa = linha.trim();
                if (linhaLimpa === "") { novoHtml += '\n'; return; }
                if (regexBloco.test(linhaLimpa)) { novoHtml += `<span class="bloco-marca">${linhaLimpa}</span>`; return; }

                // Pega as palavras da linha, ignorando vazias
                const palavras = linhaLimpa.split(/\s+/).filter(p => p !== "");
                
                // Validação de Linha: Considera cifra se todas as palavras forem acordes 
                // OU símbolos comuns como barras de compasso (|), (2x), etc.
                let ehLinhaDeCifra = palavras.length > 0 && palavras.every(p => 
                    regexAcorde.test(p) || /^[\|:()0-9xX.*-]+$/.test(p)
                );

                if (ehLinhaDeCifra) {
                    let novaLinha = '', palavraAtual = '';
                    for(let i=0; i<linha.length; i++) {
                        if(linha[i] !== ' ' && linha[i] !== '\r') { palavraAtual += linha[i]; } 
                        else {
                            if(palavraAtual) { 
                                novaLinha += `<span class="cifra">${transporAcordeCompleto(palavraAtual, semitonsAjustados)}</span>`; 
                                palavraAtual = ''; 
                            }
                            if (linha[i] === ' ') novaLinha += ' ';
                        }
                    }
                    if(palavraAtual) novaLinha += `<span class="cifra">${transporAcordeCompleto(palavraAtual, semitonsAjustados)}</span>`;
                    novoHtml += novaLinha + '\n';
                } else { novoHtml += linha + '\n'; }
            });
            document.getElementById('container-cifra').innerHTML = novoHtml;
        }

        function mudarModoVisao(modo) {
            document.getElementById('btn-janela-tom').style.display = modo === 'letra' ? 'none' : 'flex';
            document.getElementById('aba-cifra').classList.toggle('ativo', modo === 'cifra');
            document.getElementById('aba-letra').classList.toggle('ativo', modo === 'letra');
            document.getElementById('container-cifra').classList.toggle('modo-vocal', modo === 'letra');
        }

        document.addEventListener('click', function() { document.getElementById('janela-quadrado-tom').classList.remove('aberto'); });
        renderizarCifra(); gerarGradeDeTons();
    </script>
</body>
</html>
